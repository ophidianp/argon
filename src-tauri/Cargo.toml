[package]
name = "argon"
version = "1.0.0"
description = "Argon - a command deck for your coding agents"
edition = "2021"

[lib]
name = "argon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
window-vibrancy = "0.6"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
